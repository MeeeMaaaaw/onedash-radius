# Put limit_req_zone in nginx's http context, outside server blocks.
limit_req_zone $binary_remote_addr zone=onedash_devices:10m rate=5r/s;

server {
    listen 443 ssl;
    server_name coins.example.com;
    ssl_certificate /etc/letsencrypt/live/coins.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coins.example.com/privkey.pem;
    client_max_body_size 32k;

    location /api/device/ {
        limit_req zone=onedash_devices burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    # Admin and RADIUS REST routes remain local-only.
    location / { return 404; }
}
